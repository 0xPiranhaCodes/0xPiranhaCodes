<svg xmlns="http://www.w3.org/2000/svg" width="400" height="243" viewBox="0 0 400 243" role="img"><title>I build things that live in or near a terminal.</title><style>@font-face{font-family:'JetBrains Mono';font-weight:100 800;font-display:block;src:url(data:font/woff2;base64,) format('woff2')}</style><path d="M14 .5H399.5V229L386 242.5H.5V14Z" fill="#151b23" stroke="#1f6feb"/><text x="22.0" y="54.0" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="28" font-weight="800" fill="#f0f6fc" text-anchor="start">I build things that</text><text x="22.0" y="91.0" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="28" font-weight="800" fill="#f0f6fc" text-anchor="start">live in or near a</text><text x="22.0" y="128.0" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="28" font-weight="800" fill="#f0f6fc" text-anchor="start">terminal.</text><text x="22.0" y="173.0" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="500" fill="#9198a1" text-anchor="start">I started webpty in 2020 to solve a</text><text x="22.0" y="193.0" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="500" fill="#9198a1" text-anchor="start">problem at work, and in 2026 I rewrote it</text><text x="22.0" y="213.0" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="500" fill="#9198a1" text-anchor="start">from scratch in Go and shipped 1.0.</text></svg>