<svg xmlns="http://www.w3.org/2000/svg" width="400" height="178" viewBox="0 0 400 178" role="img"><title>pinfold</title><style>@font-face{font-family:'JetBrains Mono';font-weight:100 800;font-display:block;src:url(data:font/woff2;base64,) format('woff2')}</style><path d="M14 .5H399.5V164L386 177.5H.5V14Z" fill="#f6f8fa" stroke="#0969da"/><text x="22.0" y="36.0" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="800" fill="#0969da" text-anchor="start">pinfold</text><text x="22.0" y="56.0" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="500" fill="#59636e" text-anchor="start">Rust · pre-alpha</text><text x="22.0" y="82.0" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start">A memory-first terminal for agentic coding, in</text><text x="22.0" y="100.0" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start">design. Run coding agents side by side, get</text><text x="22.0" y="118.0" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start">alerted when one needs you, approve what they</text><text x="22.0" y="136.0" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start">can touch and review their diffs live.</text></svg>