projects:
  - repo: pinfold.sh
    name: pinfold
    lang: Rust
    tag: pre-alpha
    desc:
      - A memory-first terminal for agentic coding, in design. Run coding
      - agents side by side, get alerted when one needs you, approve what
      - they can touch and review their diffs live.
  - repo: webpty
    lang: Go · TypeScript
    tag: v1.0.2
    desc:
      - Real terminals in the browser, from one self-contained binary.
      - Share a session with an editor or viewer, record it, play it back.
      - Signed, reproducible releases · audit log · ~18k lines of tests
  - repo: msgs
    lang: Rust
    tag: new · Oct 2026
    desc:
      - Ephemeral, serverless team chat in your terminal. Clients connect
      - directly, encrypted with the Noise protocol. No host, no history.
  - repo: sache
    lang: Go
    desc:
      - An LRU cache built from a map and a doubly linked list.
  - repo: node-codecompiler-ide
    lang: Node.js · Express · MongoDB
    tag: "2017"
    desc:
      - "Code Lordz: a web IDE that compiles code and checks it against test cases."
  - repo: soon
    name: coming soon
    soon: true
    lang: ""
    tag: in the works
    desc:
      - Something new for the terminal. Watch this space.

